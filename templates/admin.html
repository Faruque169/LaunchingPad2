{% extends "admin_base.html" %}
{% set active = 'control' %}
{% block title %}Control{% endblock %}
{% block head %}<style>
.onstage{background:var(--plum);color:#fff;border-radius:18px;padding:1.3rem 1.4rem;margin:1.2rem 0;display:grid;grid-template-columns:1.3fr 1fr auto;gap:1.2rem 1.6rem;align-items:center}
.onstage h2{margin:0;font-size:1.5rem;color:#fff}.onstage .sub{color:#CFC6E6}
.os-who{display:flex;gap:1rem;align-items:center;min-width:0}
.os-count b{font:800 3rem/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.os-count span{color:#CFC6E6;margin-left:.4rem}
.meter{height:.55rem;border-radius:99px;background:var(--plum-3);margin-top:.6rem;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);transition:width .5s}
.os-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.onstage .btn.ghost,.onstage button.ghost{color:#fff;border-color:var(--plum-4)}
@media (max-width:820px){.onstage{grid-template-columns:1fr}}
.vis{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.vis p{margin:0;flex:1 1 18rem}
tr.open td{background:color-mix(in srgb,var(--live) 9%,transparent)}
</style>{% endblock %}
{% block content %}
<div class="wrap" style="max-width:68rem">
  <div class="msg err" id="addr" hidden></div>
  <section class="onstage" id="onstage"><div>Loading</div></section>
  <section class="card vis">
    <div class="seg" role="group" aria-label="Results on the projector">
      <button id="m-live" aria-pressed="true">Show each result</button>
      <button id="m-final" aria-pressed="false">Hold until the end</button>
    </div>
    <p class="hint" id="modeNote"></p>
    <button id="reveal" class="gold" hidden></button>
  </section>
  <section class="card tablewrap">
    <table><thead><tr><th>No.</th><th>Presenter</th><th>Status</th><th class="num">Scores</th><th class="num">Average</th><th>Actions</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="muted">Loading</td></tr></tbody></table>
  </section>
  <p class="hint" id="sync" style="display:flex;gap:1rem;flex-wrap:wrap"><span id="syncT"></span>
    <a href="/admin/export.csv">Download all scores</a><a href="/admin/results.csv">Download results</a></p>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>(String(n).replace(/\./g,' ').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();
const av=(p,s)=>p.photo?`<img class="av" style="--s:${s}px" src="${p.photo}" alt="">`:`<span class="av" style="--s:${s}px">${esc(ini(p.name))}</span>`;
let S=null,busy=false;
async function post(u){
  if(busy)return;busy=true;
  try{const r=await fetch(u,{method:'POST'});if(r.status===401){location='/admin/login';return}
    const j=await r.json().catch(()=>({}));if(j.ok===false&&j.error)alert(j.error)}finally{busy=false}
  await load()}
const b=(label,url,cls='')=>`<button class="sm ${cls}" onclick="post('${url}')">${label}</button>`;
async function load(){
  try{
    const r=await fetch('/admin/api/state',{cache:'no-store'});if(r.status===401){location='/admin/login';return}
    S=await r.json();
    const op=S.presenters.find(p=>p.status==='open'),nx=S.presenters.find(p=>p.id===S.next_id);
    $('addr').hidden=S.base_ok;
    if(!S.base_ok)$('addr').innerHTML='QR codes currently point to <b>'+esc(S.base)+'</b>, which phones cannot open. Set the public address in <a href="/admin/data">Data</a>.';
    if(op){
      const pct=S.total?Math.min(100,op.votes/S.total*100):0;
      $('onstage').innerHTML=`<div class="os-who">${av(op,64)}<div style="min-width:0"><span class="pill open">Voting open</span><h2>${esc(op.name)}</h2><div class="sub">${esc(op.portfolio)}</div></div></div>
      <div class="os-count"><b>${op.votes}</b><span>of ${S.total} scores in</span><div class="meter"><i style="width:${pct}%"></i></div></div>
      <div class="os-actions">${b('Close and show result',`/admin/presenter/${op.id}/close_show`,'gold')}${b('Close only',`/admin/presenter/${op.id}/close`,'ghost')}</div>`;
    }else{
      $('onstage').innerHTML=`<div class="os-who"><div><h2>No one is on stage</h2><div class="sub">${nx?'Next in the queue is '+esc(nx.name)+'.':'Every presenter has been scored.'}</div></div></div><div></div>
      <div class="os-actions">${nx?b('Open voting for '+esc(nx.name),'/admin/next','gold'):''}</div>`;
    }
    $('rows').innerHTML=S.presenters.map(p=>{
      const open=p.status==='open',closed=p.status==='closed';
      const a=open?b('Close and show result',`/admin/presenter/${p.id}/close_show`)+' '+b('Close only',`/admin/presenter/${p.id}/close`,'ghost')
        :b(closed?'Reopen voting':'Open voting',`/admin/presenter/${p.id}/open`,closed?'ghost':'')+(closed?' '+b(p.shown?'On screen':'Show result',`/admin/presenter/${p.id}/show`,'ghost'):'');
      return `<tr class="${open?'open':''}"><td class="num">${p.id}</td><td><div class="who-cell">${av(p,40)}<div><b>${esc(p.name)}</b><span class="muted">${esc(p.portfolio)}</span></div></div></td>
      <td><span class="pill ${open?'open':''}">${open?'Voting open':closed?'Closed':'Waiting'}</span></td>
      <td class="num">${p.votes} / ${S.total}</td><td class="num">${p.votes?p.avg.toFixed(2):'-'}</td><td><div class="row">${a}</div></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No presenters yet. Add them on the Import page.</td></tr>';
    const live=S.mode==='live';
    $('m-live').setAttribute('aria-pressed',live);$('m-final').setAttribute('aria-pressed',!live);
    $('reveal').hidden=live;$('reveal').textContent=S.final?'Hide final leaderboard':'Reveal final leaderboard';
    $('modeNote').textContent=live?'The projector shows each presenter’s result when you close voting, plus a top 10.':(S.final?'The final leaderboard is on the projector.':'The projector shows progress only. Scores stay hidden until you reveal the final leaderboard.');
    $('syncT').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){$('syncT').textContent='Connection lost. Retrying'}
}
$('m-live').onclick=()=>post('/admin/mode/live');$('m-final').onclick=()=>post('/admin/mode/final');
$('reveal').onclick=()=>post('/admin/reveal/'+(S.final?'off':'on'));
load();setInterval(load,2500);
</script>
{% endblock %}
