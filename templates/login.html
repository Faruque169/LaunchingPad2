{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block head %}<style>
body{background:var(--plum);min-height:100vh;display:grid;place-items:center;padding:1rem}
.login{width:100%;max-width:25rem;background:var(--card);border-radius:22px;padding:2rem 1.6rem}
.login h1{font-size:1.6rem}
</style>{% endblock %}
{% block body %}
<form method="post" class="login">
  <h1>{{ event_name }}</h1>
  <p class="muted">Organizer sign in</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autofocus autocomplete="current-password">
  {% if err %}<div class="msg err" role="alert">{{ err }}</div>{% endif %}
  <button class="gold" style="width:100%;margin-top:1rem">Sign in</button>
</form>
{% endblock %}
